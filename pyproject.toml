[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shioaji-microtx-engine"
version = "0.1.0"
description = "台指期（微台 TMF / 小台 MXF / 大台 TXF）當沖自動條件單引擎，基於永豐 Shioaji API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jam" }]
keywords = ["shioaji", "trading", "futures", "taiwan", "algo-trading", "day-trading"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
live = ["shioaji>=1.2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
microtx = "microtx.__main__:main"

[project.urls]
Homepage = "https://github.com/slate-re/Shioaji-MicroTX-Engine"
Issues = "https://github.com/slate-re/Shioaji-MicroTX-Engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------
#  Ruff：格式化 + Lint（PEP 8）
# ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations（強制型別提示）
    "S",    # flake8-bandit（安全性）
    "RUF",  # ruff 專屬規則
]
ignore = [
    "RUF001",  # 允許全形標點（繁中註解）
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ANN"]  # 測試允許 assert、假金鑰字面值與省略標註

# ---------------------------------------------------------------
#  Mypy：靜態型別檢查
# ---------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------
#  Pytest
# ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --cov=microtx --cov-report=term-missing"
markers = [
    "integration: 需要真實 Shioaji 連線的測試（預設跳過）",
]
